[project]
name = "masar"
version = "1.0.0"
description = "Masar: a small automation engine for Dorosak lesson intake, local sandbox only"
requires-python = ">=3.11"
# the engine in masar/ uses the standard library only. these are for api/.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[tool.uv]
package = false
