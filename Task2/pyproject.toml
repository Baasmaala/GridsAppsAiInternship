[project]
name = "tutor-agent"
version = "0.1.0"
description = "A small English tutor in the terminal, with explanations in Arabic"
readme = "README.md"
authors = [
    { name = "Basmala Shtayeh", email = "basmalashatyeh@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.3",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.16",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
